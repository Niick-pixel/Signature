name: Build Windows portable

# Produces two shapes of the same build:
#
#   Signature-portable-<version>.exe   one file, no installer, no admin rights
#   Signature-<version>-windows.zip    the same app as a plain folder
#
# Both keep their journal in a data/ folder beside the executable. The zip
# exists because the portable .exe is an unsigned NSIS self-extracting archive,
# which is one of the shapes antivirus and SmartScreen flag most readily — a
# download that reports "virus scan failed" or vanishes from the Downloads
# folder is usually that, not a real finding. A zip of an ordinary folder is
# not self-extracting and generally comes through untouched.
#
# This runs on a Windows runner because a Windows executable cannot be built
# reliably from Linux or macOS.

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'brand/**']
  workflow_dispatch:

jobs:
  # The grading arithmetic, the R math, every migration and a full
  # export/import round trip. A red run here means no build and no release:
  # sizing decisions get made off these numbers.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # The tests never open a window; skip the ~100 MB Electron download.
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      # The browser suite: every screen in both layouts, the Stats board's fit
      # at three window sizes, edit mode, the deep dives and the morning prep,
      # against a production build on seeded data.
      - name: Build
        run: npx next build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run e2e

  portable:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write        # needed to publish the release below
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Every build is a real, increasing version — the updater compares
      # version numbers, so a rolling "latest" with a fixed 0.1.0 could never
      # tell an installed copy that something newer exists.
      - name: Version this build
        shell: bash
        run: echo "VERSION=0.2.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build the installer, the portable executable and the zip
        shell: bash
        run: |
          # The owner and name come from the repository this runs in, so the
          # installed app looks for updates exactly where it was published.
          npm run desktop:build -- --publish never \
            -c.extraMetadata.version="$VERSION" \
            -c.publish.owner="${GITHUB_REPOSITORY%/*}" \
            -c.publish.repo="${GITHUB_REPOSITORY#*/}"
        env:
          # Nothing here is signed; skip electron-builder's signing discovery
          # rather than failing on a missing certificate.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Show what was produced, and checksum it
        shell: bash
        run: |
          ls -lh release/*.exe release/*.zip release/latest.yml release/*.blockmap
          echo "--- the update manifest the installed app reads"
          cat release/latest.yml
          echo "--- where the installed app looks for updates"
          cat release/win-unpacked/resources/app-update.yml
          cd release
          sha256sum Signature-Setup-*.exe Signature-portable-*.exe Signature-*-windows.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Signature-${{ env.VERSION }}
          path: |
            release/*.exe
            release/*.zip
            release/*.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      # One release per version, tagged v0.2.N. The installed app reads
      # latest.yml from the newest one; /releases/latest keeps pointing at it
      # for anyone downloading by hand.
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # Whatever repository this workflow runs in — never a hardcoded
          # owner/name, so a rename or a fork can never publish somewhere else.
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          # Check every file is there before publishing anything.
          ls -l release/Signature-Setup-*.exe release/Signature-Setup-*.exe.blockmap release/latest.yml \
                release/Signature-portable-*.exe release/Signature-*-windows.zip release/SHA256SUMS.txt

          # Deliberately not a prerelease: GitHub's /releases/latest skips
          # prereleases, and so does the updater.
          gh release create "v$VERSION" \
            release/Signature-Setup-*.exe \
            release/Signature-Setup-*.exe.blockmap \
            release/latest.yml \
            release/Signature-portable-*.exe \
            release/Signature-*-windows.zip \
            release/SHA256SUMS.txt \
            --title "Signature $VERSION" \
            --target "${{ github.sha }}" \
            --latest \
            --notes "**\`Signature-Setup-$VERSION.exe\`** — recommended. Installs for you alone (no admin), asks once where to keep your journal, and updates itself from here on.

          **\`Signature-portable-$VERSION.exe\`** and **\`Signature-$VERSION-windows.zip\`** — the same app without installing; the journal lives in a \`data\` folder beside it. These do not update themselves.

          Nothing is code-signed, so Windows SmartScreen warns on first launch: choose **More info → Run anyway**. If a download fails with *virus scan failed*, or finishes and then vanishes from Downloads, that is Defender reacting to an unsigned executable rather than to anything found in it — take the **zip**, or add an exclusion for the folder.

          \`SHA256SUMS.txt\` lists the checksum of every download.

          Built from \`${{ github.sha }}\`."

          # The rolling release from before versioned builds; its fixed 0.1.0
          # would never be offered as an update anyway.
          gh release delete latest --cleanup-tag --yes || true

          # Keep the ten newest versions. Updates only ever need the newest.
          gh release list --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[10:] | .[].tagName' \
            | grep '^v0\.' | while read -r tag; do gh release delete "$tag" --cleanup-tag --yes; done || true
